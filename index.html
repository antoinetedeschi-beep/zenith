<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Coffre du Grand Zénith – Escape game EPEH</title>
<style>
:root{--bg:#f4ede1;--card:#fffaf0;--tx:#2a2118;--mut:#6b5d4d;--gold:#a8741a;--ac:#8c2f39;--ok:#1d7a46;--ko:#b3261e;--bd:#dccbb0;--g1:#f0d9a8;--g2:#e8b9a0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15110d;--card:#241c15;--tx:#f1e7d6;--mut:#b5a58e;--gold:#e5b457;--ac:#e8838d;--ok:#62d68f;--ko:#ff8a80;--bd:#43352a;--g1:#4a3516;--g2:#4a2422;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15110d;--card:#241c15;--tx:#f1e7d6;--mut:#b5a58e;--gold:#e5b457;--ac:#e8838d;--ok:#62d68f;--ko:#ff8a80;--bd:#43352a;--g1:#4a3516;--g2:#4a2422;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,sans-serif}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:8px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#rooms{display:flex;gap:6px;font-size:1.3rem}#rooms span{opacity:.45;filter:grayscale(1)}#rooms .cur{opacity:1;filter:none;transform:scale(1.25)}#rooms .done{opacity:1;filter:none}
.st{font-size:.85rem;color:var(--mut)}
#app{max-width:760px;margin:auto;padding:14px}
h1,h2{font-family:Georgia,serif;color:var(--gold);margin:6px 0}
.banner{border-radius:16px;padding:22px 16px;text-align:center;font-size:2.6rem;background:linear-gradient(135deg,var(--g1),var(--g2));border:1px solid var(--bd);letter-spacing:8px}
.banner small{display:block;font-size:1rem;letter-spacing:0;font-family:Georgia,serif;color:var(--tx);margin-top:4px;font-weight:700}
.say{display:flex;gap:12px;align-items:flex-start;margin:14px 0}
.av{flex:none;width:68px;height:68px;border-radius:50%;background:var(--g1);border:3px solid var(--gold);display:grid;place-items:center;font-size:2.2rem}
.bub{background:var(--card);border:1px solid var(--bd);border-radius:4px 16px 16px 16px;padding:10px 14px;flex:1}
.bub b.n{color:var(--ac)}
.f{background:var(--g1);border-left:4px solid var(--gold);padding:8px 12px;margin:8px 0;border-radius:6px;font-family:Georgia,serif}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin:12px 0}
.tag{display:inline-block;font-size:.75rem;background:var(--gold);color:#1a1209;border-radius:20px;padding:1px 10px;font-weight:700}
input{padding:10px;border:2px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:1.1rem;width:150px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
button{padding:10px 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:700;cursor:pointer;font-size:.95rem}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.g{background:var(--gold);color:#1a1209}
.msg{margin-top:8px;padding:8px 12px;border-radius:8px;display:none}
.msg.ok{display:block;background:color-mix(in srgb,var(--ok) 18%,transparent);border-left:4px solid var(--ok)}
.msg.ko{display:block;background:color-mix(in srgb,var(--ko) 18%,transparent);border-left:4px solid var(--ko)}
.code{display:flex;gap:8px;justify-content:center;margin:12px 0}
.dg{width:48px;height:62px;border-radius:10px;border:2px solid var(--gold);display:grid;place-items:center;font-size:1.8rem;font-weight:800;background:var(--card);font-family:Georgia,serif}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pp .6s}@keyframes pp{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.big{text-align:center;font-size:3rem}
</style></head><body>
<div id="top"><div id="rooms"></div><div class="st">⏱️ <span id="tm">00:00</span> · 💡 <span id="hc">0</span> indice(s) · ❌ <span id="ec">0</span> erreur(s)</div></div>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const nf=(x,d=2)=>Number(x).toLocaleString('fr-FR',{maximumFractionDigits:d});
const r=(a,b,s=1)=>a+s*Math.floor(Math.random()*((b-a)/s+1));
const num=v=>parseFloat(String(v).replace(/\s/g,'').replace(',','.'));
const Q=(th,q,a,d,u,s,h)=>({th,q,a,d,u,s,h});

const ROOMS=[
{n:'La Cuisine',sc:'🍳🔪🥘',p:'Chef Antoine',pe:'👨‍🍳',
 say:'Les prix des matières premières bougent tout le temps ! Avant de te donner la clé, montre-moi que tu sais mesurer une évolution.',
 les:'<b>Taux de variation</b> = (VA − VD) ÷ VD × 100<br><b>Coefficient multiplicateur</b> CM = VA ÷ VD = 1 + t<br>VD = valeur de départ (avant), VA = valeur d’arrivée (après).',
 qs:[()=>{const a=r(60,120,5)/10,t=r(-20,30)||10,b=Math.round(a*(1+t/100)*100)/100,x=(b-a)/a*100;
  return Q('Taux de variation',`Le kilo de beurre passe de ${nf(a)} € à ${nf(b)} €. Quel est le taux de variation (en %, 1 décimale) ?`,x,1,'%',`(${nf(b)} − ${nf(a)}) ÷ ${nf(a)} × 100 = ${nf(x,1)} %`,'Le dénominateur est toujours la valeur de départ : ici le prix d’avant.')},
 ()=>{const a=r(20,40),t=r(5,25),x=a*(1+t/100);
  return Q('Valeur d’arrivée',`Le filet de bœuf coûte ${a} €/kg. Son prix augmente de ${t} %. Nouveau prix au kg (2 décimales) ?`,x,2,'€',`CM = 1 + ${t/100} = ${nf(1+t/100,2)} ; ${a} × ${nf(1+t/100,2)} = ${nf(x,2)} €`,'Une hausse de t % se calcule en multipliant par (1 + t/100).')},
 ()=>{const c=r(180,520,10)/100,pv=r(1200,2800,50)/100,x=pv/c;
  return Q('Coefficient multiplicateur',`Un plat a un coût matière de ${nf(c)} € et se vend ${nf(pv)} € HT. Calcule le coefficient multiplicateur (2 décimales).`,x,2,'',`${nf(pv)} ÷ ${nf(c)} = ${nf(x,2)}`,'CM = prix de vente ÷ coût matière.')}]},
{n:'La Salle de restaurant',sc:'🍽️🕯️🥂',p:'Clara, maîtresse d’hôtel',pe:'🤵',
 say:'Ici, on compte les couverts et le chiffre d’affaires ! Le panier moyen nous dit combien dépense chaque client.',
 les:'<b>Panier moyen</b> = CA HT ÷ nombre de couverts<br>Retrouver VD : <b>VD = VA ÷ (1 + t)</b> (on divise par le CM, on ne retranche pas t %).',
 qs:[()=>{const a=r(20000,90000,500),t=r(-15,25)||7,b=Math.round(a*(1+t/100)),x=(b-a)/a*100;
  return Q('Taux de variation',`CA HT de ${nf(a)} € en N-1 et ${nf(b)} € en N. Taux de variation (en %, 1 décimale) ?`,x,1,'%',`(${nf(b)} − ${nf(a)}) ÷ ${nf(a)} × 100 = ${nf(x,1)} %`,'(arrivée − départ) ÷ départ × 100.')},
 ()=>{const n=r(60,140,2),p=r(18,45),c=n*p,x=c/n;
  return Q('Panier moyen',`Ce soir : CA HT de ${nf(c)} € pour ${n} couverts. Quel est le panier moyen (en €) ?`,x,2,'€',`${nf(c)} ÷ ${n} = ${nf(x,2)} €`,'Panier moyen = CA ÷ couverts.')},
 ()=>{const t=r(5,25),v=r(30000,80000,1000),x=v/(1+t/100);
  return Q('Valeur de départ',`Après une hausse de ${t} %, le CA atteint ${nf(v)} €. Quel était le CA avant (arrondi à l’euro) ?`,x,0,'€',`VD = ${nf(v)} ÷ ${nf(1+t/100,2)} = ${nf(x,0)} €`,'Divise la valeur finale par le coefficient multiplicateur.')}]},
{n:'La Réception',sc:'🛎️🗝️🏨',p:'Samir, réceptionniste',pe:'🧑‍💼',
 say:'À l’hébergement, on suit trois indicateurs : le taux d’occupation, le prix moyen et le RevPAR. Prêt ?',
 les:'<b>Taux d’occupation</b> = chambres vendues ÷ chambres disponibles × 100<br><b>Prix moyen</b> = CA hébergement HT ÷ chambres vendues<br><b>RevPAR</b> = CA hébergement HT ÷ chambres disponibles = TO × prix moyen',
 qs:[()=>{const d=r(20,60,2),v=r(Math.round(d*.4),Math.round(d*.95)),x=v/d*100;
  return Q('Taux d’occupation',`L’hôtel a ${d} chambres, ${v} sont vendues cette nuit. Taux d’occupation (en %, 1 décimale) ?`,x,1,'%',`${v} ÷ ${d} × 100 = ${nf(x,1)} %`,'Vendues ÷ disponibles × 100.')},
 ()=>{const v=r(15,40),pm=r(70,150,5),ca=v*pm;
  return Q('Prix moyen',`${v} chambres vendues pour un CA hébergement HT de ${nf(ca)} €. Prix moyen (en €) ?`,pm,2,'€',`${nf(ca)} ÷ ${v} = ${nf(pm,2)} €`,'CA ÷ chambres vendues (pas disponibles !).')},
 ()=>{const d=r(20,50,2),to=r(50,90,5),pm=r(70,160,5),x=to/100*pm;
  return Q('RevPAR',`Hôtel de ${d} chambres, TO de ${to} %, prix moyen de ${pm} € HT. Calcule le RevPAR (2 décimales).`,x,2,'€',`RevPAR = ${to/100} × ${pm} = ${nf(x,2)} €`,'RevPAR = taux d’occupation (en décimal) × prix moyen.')}]},
{n:'La Cave & la Caisse',sc:'🍷🍾🧾',p:'Lina, sommelière',pe:'👩',
 say:'Sur la carte, il y a les prix TTC, mais l’entreprise raisonne en HT. À toi de faire la différence !',
 les:'<b>PV TTC</b> = PV HT × (1 + taux de TVA)  (10 % en restauration sur place)<br><b>PV HT</b> = PV TTC ÷ 1,10<br><b>Marge</b> = PV HT − coût matière',
 qs:[()=>{const h=r(8,40),x=h*1.1;
  return Q('Prix TTC',`Un plat est vendu ${h} € HT (TVA 10 %). Prix TTC (2 décimales) ?`,x,2,'€',`${h} × 1,10 = ${nf(x,2)} €`,'Multiplie par 1,10.')},
 ()=>{const h=r(10,40),t=Math.round(h*1.1*100)/100;
  return Q('Prix HT',`Un menu est affiché ${nf(t)} € TTC (TVA 10 %). Quel est son prix HT (2 décimales) ?`,h,2,'€',`${nf(t)} ÷ 1,10 = ${nf(h,2)} €`,'Pour passer du TTC au HT, on divise par 1,10.')},
 ()=>{const c=r(4,9),h=r(18,32),x=h-c;
  return Q('Marge',`Un plat a un coût matière de ${c} € et un prix de vente HT de ${h} €. Quelle est la marge brute (en €) ?`,x,2,'€',`${h} − ${c} = ${x} €`,'Marge = prix de vente HT − coût matière.')}]},
{n:'Le Bureau du Directeur',sc:'🗄️🔐🎩',p:'M. Moreau, directeur',pe:'🎩',
 say:'Dernière épreuve ! Un bon gestionnaire sait enchaîner des évolutions et comparer des indicateurs. Le coffre est derrière moi…',
 les:'<b>Variations successives</b> : on multiplie les CM (CM₁ × CM₂), taux global = CM − 1.<br><b>Taux réciproque</b> = 1 ÷ CM − 1.<br>Pour comparer deux paniers moyens : calcule chaque panier, puis le taux de variation.',
 qs:[()=>{const a=r(5,30),b=r(5,30),x=((1+a/100)*(1-b/100)-1)*100;
  return Q('Variations successives',`Un prix augmente de ${a} % puis baisse de ${b} %. Taux global (en %, 2 décimales) ?`,x,2,'%',`${nf(1+a/100,2)} × ${nf(1-b/100,2)} = ${nf((1+a/100)*(1-b/100),4)} → ${nf(x,2)} %`,'Multiplie les deux coefficients multiplicateurs puis retire 1.')},
 ()=>{const t=r(10,40),x=(1/(1-t/100)-1)*100;
  return Q('Taux réciproque',`Le CA a baissé de ${t} %. Quelle hausse (en %, 1 décimale) pour revenir au niveau initial ?`,x,1,'%',`1 ÷ ${nf(1-t/100,2)} − 1 = ${nf(x/100,3)} → ${nf(x,1)} %`,'CM de la baisse = 1 − t/100. Le taux réciproque est 1 ÷ CM − 1.')},
 ()=>{const n1=r(80,200,5),c1=n1*r(22,40),n2=n1+r(-20,30,5)||n1+5,c2=Math.round(n2*r(22,44)/10)*10,p1=c1/n1,p2=c2/n2,x=(p2/p1-1)*100;
  return Q('Panier moyen',`N-1 : ${nf(c1)} € HT pour ${n1} couverts. N : ${nf(c2)} € HT pour ${n2} couverts. Taux de variation du panier moyen (en %, 1 décimale) ?`,x,1,'%',`Panier N-1 = ${nf(p1,2)} € ; N = ${nf(p2,2)} € ; variation = ${nf(x,1)} %`,'Calcule d’abord chaque panier moyen, puis le taux de variation.')}]}
];

let S,T,timer;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function hud(){let h='';ROOMS.forEach((o,i)=>h+=`<span class="${i<S.room?'done':i===S.room&&S.view!=='home'?'cur':''}" title="${o.n}">${S.room>i?'🔓':o.sc.slice(0,2)}</span>`);
 h+=`<span class="${S.view==='final'?'cur':''}">🔐</span>`;$('#rooms').innerHTML=h;$('#hc').textContent=S.hints;$('#ec').textContent=S.err;}
function tick(){if(S.view!=='home'&&S.view!=='end')$('#tm').textContent=fmt(Math.floor((Date.now()-T)/1000));}
function say(pe,name,html){return `<div class="say"><div class="av">${pe}</div><div class="bub"><b class="n">${name}</b><br>${html}</div></div>`;}
function start(){S={room:0,view:'home',hints:0,err:0,code:Array.from({length:5},()=>r(1,9))};$('#tm').textContent='00:00';home();}
function home(){hud();$('#app').innerHTML=`<div class="banner">🏨🔐<small>Le Coffre du Grand Zénith</small></div>
${say('🎩','M. Moreau, directeur','Catastrophe ! Le coffre du Grand Zénith est verrouillé et l’inspecteur arrive pour le service du soir. Le code à 5 chiffres est éparpillé dans <b>5 lieux de l’hôtel-restaurant</b>. Dans chacun, un collègue te posera <b>3 énigmes de calcul</b>. Réussis-les pour gagner un chiffre !')}
<div class="card">🎯 <b>Mission :</b> récupérer les 5 chiffres puis ouvrir le coffre.<br>💡 Les indices t’aident mais comptent dans ton score. ⏱️ Le chrono tourne dès que tu entres.<br>📝 Tu peux utiliser une calculatrice. Arrondis comme demandé.</div>
<div class="row"><button class="g" id="go">🚪 Entrer dans l’hôtel</button></div>`;
 $('#go').onclick=()=>{T=Date.now();clearInterval(timer);timer=setInterval(tick,1000);S.view='lesson';room();};}
function room(){const o=ROOMS[S.room];S.view='lesson';S.q=0;S.cur=o.qs.map(g=>g());hud();
 $('#app').innerHTML=`<div class="banner">${o.sc}<small>Salle ${S.room+1}/5 – ${o.n}</small></div>${say(o.pe,o.p,o.say)}
<div class="card"><b>📖 Le carnet de ${o.p.split(',')[0]}</b><div class="f">${o.les}</div></div>
<div class="row"><button class="g" id="rd">J’ai compris, aux énigmes ! →</button></div>`;
 $('#rd').onclick=question;window.scrollTo(0,0);}
function question(){const o=ROOMS[S.room],q=S.cur[S.q];S.view='q';S.tries=0;hud();
 $('#app').innerHTML=`<div class="banner" style="font-size:1.6rem">${o.sc.slice(0,2)} ${o.n}</div>
<div class="card"><span class="tag">Énigme ${S.q+1}/3 · ${q.th}</span><p style="font-size:1.1rem">${q.q}</p>
<div class="row"><input id="an" type="text" inputmode="decimal" placeholder="Ta réponse" autofocus>${q.u?`<b>${q.u}</b>`:''}<button id="ck">Valider</button><button class="s" id="hn">💡 Indice</button></div>
<div class="msg" id="ms"></div></div>`;
 $('#ck').onclick=()=>check(q);$('#an').onkeydown=e=>{if(e.key==='Enter')check(q);};
 $('#hn').onclick=()=>{S.hints++;hud();const m=$('#ms');m.className='msg ok';m.innerHTML=`${say(o.pe,o.p.split(',')[0],'💡 '+q.h)}`;};}
function next(){S.q++;S.q<3?question():reward();}
function check(q){const v=num($('#an').value),m=$('#ms');if(!isFinite(v))return;
 if(Math.abs(v-q.a)<=Math.pow(10,-q.d)*1.01){m.className='msg ok';m.innerHTML=`✅ Exact ! <i>${q.s}</i><div class="row"><button id="nx">Continuer →</button></div>`;$('#nx').onclick=next;$('#ck').disabled=true;}
 else{S.err++;S.tries++;hud();m.className='msg ko';$('#ck').parentElement.classList.add('shake');setTimeout(()=>$('#ck').parentElement.classList.remove('shake'),400);
  m.innerHTML=S.tries>=2?`❌ Pas tout à fait. Solution : <b>${nf(q.a,q.d)} ${q.u}</b><br><i>${q.s}</i><div class="row"><button id="nx">J’ai compris, continuer →</button></div>`:'❌ Ce n’est pas la bonne réponse. Relis le carnet ou prends un indice, puis réessaie !';
  if(S.tries>=2){$('#nx').onclick=next;$('#ck').disabled=true;}}}
function reward(){const o=ROOMS[S.room],d=S.code[S.room];S.view='rew';hud();
 $('#app').innerHTML=`<div class="big pop">🗝️</div><h2 style="text-align:center">Salle validée !</h2>${say(o.pe,o.p.split(',')[0],`Bravo ! Voici ton chiffre : <b style="font-size:1.4rem">${d}</b>. Note-le dans ton carnet !`)}
<div class="code">${S.code.map((c,i)=>`<div class="dg">${i<=S.room?c:'?'}</div>`).join('')}</div>
<div class="row" style="justify-content:center"><button class="g" id="nr">${S.room<4?'Salle suivante →':'Ouvrir le coffre 🔐'}</button></div>`;
 $('#nr').onclick=()=>{S.room++;S.room<5?room():final();};}
function final(){S.view='final';S.room=5;hud();
 $('#app').innerHTML=`<div class="banner">🔐<small>Le coffre du Grand Zénith</small></div>${say('🎩','M. Moreau','Voilà le coffre ! Entre les 5 chiffres dans l’ordre de tes salles (cuisine → bureau).')}
<div class="card"><div class="row" style="justify-content:center"><input id="cd" maxlength="5" inputmode="numeric" placeholder="_ _ _ _ _" style="width:170px;text-align:center;letter-spacing:8px;font-size:1.5rem"><button class="g" id="op">Ouvrir</button></div>
<div class="msg" id="ms"></div></div>`;
 $('#op').onclick=()=>{if($('#cd').value.trim()===S.code.join('')){end();}else{const m=$('#ms');m.className='msg ko';m.textContent='🔒 Code incorrect. Regarde les chiffres gagnés dans chaque salle.';}};}
function end(){S.view='end';clearInterval(timer);const sec=Math.floor((Date.now()-T)/1000),pen=S.hints+S.err,st=pen<=3?3:pen<=8?2:1;
 $('#app').innerHTML=`<div class="big pop">🎉🔓🎉</div><h1 style="text-align:center">Coffre ouvert !</h1>
${say('🎩','M. Moreau','Magnifique ! L’inspecteur sera ravi. Tu maîtrises les variations et les indicateurs de l’hôtellerie-restauration !')}
<div class="card" style="text-align:center"><div class="big">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div>⏱️ Temps : <b>${fmt(sec)}</b> · 💡 Indices : <b>${S.hints}</b> · ❌ Erreurs : <b>${S.err}</b><br><span class="st">${st===3?'Expert(e) en gestion !':st===2?'Très bien, encore un petit effort pour les étoiles manquantes.':'Rejoue pour consolider : les nombres changent à chaque partie !'}</span></div>
<div class="row" style="justify-content:center"><button class="g" id="rp">🔄 Rejouer avec de nouveaux chiffres</button></div>`;
 $('#rp').onclick=start;}
start();
</script></body></html>
